<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>Page Moved</title>

    <!-- SEO -->
    <meta name="description"
        content="This page has moved to a new location. You will be automatically redirected to the updated page.">

    <meta name="robots" content="noindex, follow">

    <!-- Canonical New URL -->
    <link rel="canonical" href="https://example.com/new-page">

    <!-- Instant Redirect -->
    <meta http-equiv="refresh" content="0; url=https://example.com/new-page">

    <!-- Open Graph -->
    <meta property="og:title" content="Page Moved">
    <meta property="og:description"
        content="This page has moved to a new location. Redirecting to the updated page.">
    <meta property="og:url" content="https://example.com/new-page">
    <meta property="og:type" content="website">

    <!-- Theme -->
    <meta name="theme-color" content="#000000">

    <!-- Referrer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- JS Redirect Backup -->
    <script>
        window.location.replace("https://example.com/new-page");
    </script>

</head>

<body>

    <p>
        This page has moved.
        If you are not redirected automatically,
        <a href="https://example.com/new-page">
            click here
        </a>.
    </p>

</body>

</html>
