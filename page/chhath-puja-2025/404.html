<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 </title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, #110726, #020617);
      color: #fff;
      overflow: hidden;
    }

    body:before {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      background: #38bdf855;
      border-radius: 50%;
      filter: blur(100px);
      top: -100px;
      left: -100px;
    }

    .box {
      max-width: 500px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(70px, 15vw, 140px);
      color: #38bdf8;
    }

    h2 {
      margin: 10px 0;
      font-size: clamp(28px, 10vw, 40px);
    }

    p {
      color: #cbd5e1;
      margin: 15px 0;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist.</p>
    <a href="/">Go Home</a>
  </div>

  <script>
    setTimeout(() => location = "/", 1000);
  </script>

</body>

</html>
