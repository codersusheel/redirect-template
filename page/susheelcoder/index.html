<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Moved</title>

    <meta name="description"
        content="This page has moved to a new location. You will be redirected automatically.">

    <meta name="robots" content="noindex, follow">

    <!-- New Website -->
    <link rel="canonical" href="https://codersusheel.netlify.app/">

    <!-- JS Dynamic Redirect -->
    <script>
        const newBase = "https://codersusheel.netlify.app";
        const currentPath = window.location.pathname;

        window.location.replace(newBase + currentPath);
    </script>

</head>

<body>

    <p>
        Redirecting to the new website...
    </p>

</body>

</html>
