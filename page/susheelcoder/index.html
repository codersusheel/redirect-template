<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Moved</title>

    <meta name="description"
        content="This page has moved to a new website location. Redirecting automatically.">

    <meta name="robots" content="noindex, follow">

    <link rel="canonical" href="https://codersusheel.netlify.app/">

    <script>
        const newDomain = "https://codersusheel.netlify.app";

        const currentPath = window.location.pathname;
        const currentQuery = window.location.search;
        const currentHash = window.location.hash;

        const redirectUrl =
            newDomain +
            currentPath +
            currentQuery +
            currentHash;

        window.location.replace(redirectUrl);
    </script>

</head>

<body>

    <p>
        Redirecting to the new website...
    </p>

</body>

</html>
